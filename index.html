<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perform6</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000000;
        color: #ffffff;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      #boot-status {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 32px;
        z-index: 2147483647;
      }
      #boot-status .brand {
        font-size: 18px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #00e5ff;
        font-weight: 700;
      }
      #boot-status .msg {
        font-size: 32px;
        font-weight: 700;
        color: #ffffff;
      }
      #boot-status .hint {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.7);
        max-width: 32rem;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-status">
        <div class="brand">Perform6</div>
        <div class="msg" id="boot-msg">Loading app...</div>
        <div class="hint" id="boot-hint">Please wait while the player starts.</div>
      </div>
    </div>
    <script>
      (function () {
        function fail(title, detail) {
          var msg = document.getElementById('boot-msg');
          var hint = document.getElementById('boot-hint');
          if (msg) msg.textContent = title;
          if (hint) hint.textContent = detail;
        }

        window.__perform6ScriptFailed = function () {
          fail(
            'Could not load assets/app.js',
            'Missing or nested assets folder. Copy assets/ next to index.html on the SD root, then reboot.'
          );
        };

        window.setTimeout(function () {
          if (document.getElementById('boot-status')) {
            fail(
              'App did not start',
              'SD card root must contain: autorun.brs, index.html, and assets/app.js (same folder level). Extract the zip, open the folder, copy those items to the card root - not inside another folder.'
            );
          }
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
